<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" width="1400" height="920" role="img" aria-labelledby="t d">
  <title id="t">TriPin 아키텍처</title>
  <desc id="d">안드로이드 앱이 CloudFront를 거쳐 AWS의 백엔드·AI 서버와 정적 사이트에 연결되고, 백엔드는 RDS·S3·SSM과 카카오·TourAPI·Gemini를 쓰는 구조</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #202520; }
      .h1 { font-size: 30px; font-weight: 700; }
      .sub { font-size: 15px; fill: #5F6663; }
      .name { font-size: 16px; font-weight: 700; }
      .meta { font-size: 12.5px; fill: #5F6663; }
      .item { font-size: 13px; fill: #34403A; }
      .label { font-size: 13px; font-weight: 700; }
      .path { font-size: 12px; fill: #5F6663; font-family: "Consolas", "D2Coding", "Noto Sans KR", monospace; }
      .pill { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #D7DDD9; stroke-width: 1.5; }
      .line { fill: none; stroke: #5F6663; stroke-width: 2; }
      .green { stroke: #19B86A; }
      .blue { stroke: #246BEB; }
      .orange { stroke: #E8913A; }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F6663"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#19B86A"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#246BEB"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E8913A"/></marker>
  </defs>

  <!-- 바탕 (깃허브 다크 모드에서도 읽히게 흰 바탕) -->
  <rect x="0" y="0" width="1400" height="920" rx="24" fill="#ffffff"/>
  <rect x="1" y="1" width="1398" height="918" rx="24" fill="none" stroke="#E4E9E6" stroke-width="2"/>

  <text class="h1" x="40" y="60">TriPin 아키텍처</text>
  <text class="sub" x="40" y="88">안드로이드 앱과 연결된 모든 것 · 개발 서버(AWS 서울 리전) 기준</text>

  <!-- ───────── 안드로이드 앱 ───────── -->
  <rect x="40" y="130" width="270" height="300" rx="18" fill="#F1FBF5" stroke="#19B86A" stroke-width="2"/>
  <g transform="translate(62 150)">
    <rect width="30" height="52" rx="7" fill="#ffffff" stroke="#0B6C40" stroke-width="2.5"/>
    <rect x="5" y="8" width="20" height="32" rx="2" fill="#C9F0DB"/>
    <path d="M15 14c-4 0-7 3-7 7 0 5 7 11 7 11s7-6 7-11c0-4-3-7-7-7zm0 4.5a2.5 2.5 0 1 1 0 5a2.5 2.5 0 0 1 0-5z" fill="#19B86A"/>
    <rect x="11" y="44" width="8" height="2.5" rx="1.2" fill="#0B6C40"/>
  </g>
  <text class="name" x="108" y="170">TriPin 안드로이드 앱</text>
  <text class="meta" x="108" y="190">Expo SDK 57 · React Native 0.86</text>
  <text class="item" x="60" y="236">· expo-router 화면 · TanStack Query</text>
  <text class="item" x="60" y="260">· zustand (로그인 · 지역 뽑기 · 여행 초안)</text>
  <text class="item" x="60" y="284">· 3D 지도(도 조각) · 카카오맵 WebView</text>
  <text class="item" x="60" y="308">· 기기: 위치 · 카메라 · 사진 · 진동</text>
  <text class="item" x="60" y="332">· 개발용 목업 서버 (src/api/mock)</text>
  <rect x="58" y="354" width="234" height="58" rx="10" fill="#ffffff" stroke="#BFE9D2"/>
  <text class="meta" x="72" y="377">access token → 메모리</text>
  <text class="meta" x="72" y="398">refresh token → HttpOnly 쿠키</text>

  <!-- ───────── 웹 브라우저 (앱 없는 사람) ───────── -->
  <rect x="420" y="112" width="200" height="82" rx="14" class="card"/>
  <g transform="translate(436 128)">
    <rect width="34" height="28" rx="5" fill="#ffffff" stroke="#246BEB" stroke-width="2"/>
    <path d="M0 9h34" stroke="#246BEB" stroke-width="2"/>
    <circle cx="5" cy="4.5" r="1.6" fill="#246BEB"/><circle cx="10" cy="4.5" r="1.6" fill="#246BEB"/>
  </g>
  <text class="name" x="482" y="141" style="font-size:14px">웹 브라우저</text>
  <text class="meta" x="482" y="160">앱이 없는 사람</text>
  <text class="meta" x="436" y="182">공유 코스·여행기 · 초대 안내</text>

  <!-- ───────── CloudFront ───────── -->
  <rect x="420" y="236" width="200" height="172" rx="16" class="card" style="stroke:#9CC0F5;stroke-width:2"/>
  <g transform="translate(436 252)">
    <path d="M12 30h26a9 9 0 0 0 0-18a12 12 0 0 0-23-3a9 9 0 0 0-3 21z" fill="#E8F1FE" stroke="#246BEB" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <text class="name" x="486" y="272">CloudFront</text>
  <text class="meta" x="486" y="290">HTTPS · 기본 도메인</text>
  <text class="path" x="436" y="318">dn77qbtivmjzt.cloudfront.net</text>
  <text class="item" x="436" y="346">/api/*  → 백엔드</text>
  <text class="item" x="436" y="370">그 밖  → 정적 사이트</text>
  <text class="meta" x="436" y="394">(/api는 캐시 없이 쿠키·헤더 전달)</text>

  <!-- 브라우저 → CloudFront -->
  <path class="line blue" d="M520 194V234" marker-end="url(#ab)"/>
  <!-- 앱 → CloudFront -->
  <path class="line green" d="M310 300H418" marker-end="url(#ag)"/>
  <text class="label" x="322" y="290">HTTPS REST</text>
  <text class="path" x="322" y="322">/api/* · JSON</text>
  <text class="path" x="322" y="340">Bearer 토큰</text>

  <!-- ───────── AWS 영역 ───────── -->
  <rect x="680" y="128" width="690" height="482" rx="22" fill="#FFFCF7" stroke="#E8913A" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="700" y="112" width="214" height="30" rx="15" fill="#E8913A"/>
  <text class="pill" x="716" y="132">AWS · 서울 리전 (ap-northeast-2)</text>

  <!-- EC2 -->
  <rect x="710" y="164" width="350" height="252" rx="16" fill="#FFF6E9" stroke="#E8B26A" stroke-width="1.8"/>
  <g transform="translate(728 178)">
    <rect width="26" height="8" rx="2.5" fill="#ffffff" stroke="#C77B22" stroke-width="2"/>
    <rect y="10" width="26" height="8" rx="2.5" fill="#ffffff" stroke="#C77B22" stroke-width="2"/>
    <rect y="20" width="26" height="8" rx="2.5" fill="#ffffff" stroke="#C77B22" stroke-width="2"/>
  </g>
  <text class="name" x="764" y="196" style="font-size:15px">EC2 t3.small 한 대</text>
  <text class="meta" x="900" y="196">systemd · SSM 접속</text>

  <rect x="730" y="214" width="310" height="92" rx="12" fill="#ffffff" stroke="#19B86A" stroke-width="1.8"/>
  <g transform="translate(746 228)">
    <path d="M13 2C6 2 2 8 2 14c0 7 6 12 13 12 2 0 3-1 4-2 6-5 7-14 5-22-3 1-6 0-11 0z" fill="#E7F8EF" stroke="#19B86A" stroke-width="2"/>
    <path d="M6 22c4-6 9-10 15-13" stroke="#19B86A" stroke-width="2" fill="none"/>
  </g>
  <text class="name" x="782" y="244" style="font-size:15px">Spring Boot 백엔드</text>
  <text class="path" x="782" y="263">Java 21 · :8080 · /api</text>
  <text class="meta" x="746" y="292">JWT 인증 · 코스 생성·편집 · LightGBM 취향 순위</text>

  <rect x="730" y="316" width="310" height="86" rx="12" fill="#ffffff" stroke="#246BEB" stroke-width="1.8"/>
  <g transform="translate(748 330)">
    <path d="M12 0l3 8.5 8.5 3-8.5 3L12 23 9 14.5.5 11.5 9 8.5z" fill="#E8F1FE" stroke="#246BEB" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text class="name" x="782" y="346" style="font-size:15px">AI 서버 (FastAPI)</text>
  <text class="path" x="782" y="365">127.0.0.1:8000 (밖에서 못 들어옴)</text>
  <text class="meta" x="746" y="390">E5 취향 임베딩 · 코스·지역 소개 문장</text>

  <!-- 백엔드 ↔ AI -->
  <path class="line blue" d="M1010 306V314" marker-end="url(#ab)"/>

  <!-- CloudFront → 백엔드 -->
  <path class="line green" d="M620 262H728" marker-end="url(#ag)"/>
  <text class="label" x="634" y="252">/api/*</text>
  <text class="path" x="634" y="282">:8080</text>

  <!-- RDS -->
  <rect x="1120" y="164" width="230" height="112" rx="16" class="card"/>
  <g transform="translate(1138 182)">
    <ellipse cx="15" cy="5" rx="15" ry="5" fill="#E8F1FE" stroke="#3B6FD4" stroke-width="2"/>
    <path d="M0 5v22c0 2.8 6.7 5 15 5s15-2.2 15-5V5" fill="#E8F1FE" stroke="#3B6FD4" stroke-width="2"/>
    <path d="M0 16c0 2.8 6.7 5 15 5s15-2.2 15-5" fill="none" stroke="#3B6FD4" stroke-width="2"/>
  </g>
  <text class="name" x="1180" y="200" style="font-size:15px">RDS PostgreSQL</text>
  <text class="meta" x="1180" y="219">개발 DB (팀 공용)</text>
  <text class="meta" x="1138" y="250">관광지·지역 · 여행·코스 · 여행기</text>
  <text class="meta" x="1138" y="268">Flyway 마이그레이션</text>
  <path class="line" d="M1060 222H1118" marker-end="url(#a)"/>
  <text class="label" x="1068" y="212" style="font-size:12px">JPA</text>

  <!-- SSM -->
  <rect x="1120" y="300" width="230" height="116" rx="16" class="card"/>
  <g transform="translate(1138 318)">
    <circle cx="9" cy="9" r="8" fill="#FFF4E5" stroke="#C77B22" stroke-width="2"/>
    <path d="M15 14l13 13m-5-5 3-3m-6 0 3-3" stroke="#C77B22" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text class="name" x="1180" y="336" style="font-size:15px">SSM Parameter Store</text>
  <text class="meta" x="1180" y="355">/tripin/dev/*</text>
  <text class="meta" x="1138" y="386">DB·JWT 비밀값 · 카카오 키</text>
  <text class="meta" x="1138" y="404">서버 설정 · 앱 빌드 설정</text>
  <path class="line" d="M1060 358H1118" marker-end="url(#a)"/>
  <text class="label" x="1066" y="348" style="font-size:12px">설정</text>

  <!-- S3 정적 사이트 -->
  <rect x="710" y="452" width="250" height="132" rx="16" class="card"/>
  <g transform="translate(728 470)">
    <path d="M2 4h26l-3 24H5z" fill="#FDF0E6" stroke="#C7531F" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="15" cy="4" rx="13" ry="3.5" fill="#FDF0E6" stroke="#C7531F" stroke-width="2"/>
  </g>
  <text class="name" x="768" y="488" style="font-size:15px">S3 정적 사이트</text>
  <text class="meta" x="768" y="507">CloudFront만 읽기 (OAC)</text>
  <text class="item" x="728" y="536">· 공유 코스·여행기 웹페이지</text>
  <text class="item" x="728" y="557">· 초대 안내 · 앱 링크 파일</text>
  <text class="item" x="728" y="578">· APK 다운로드 (download/)</text>

  <!-- CloudFront → 정적 사이트 -->
  <path class="line blue" d="M560 408V518H708" marker-end="url(#ab)"/>
  <text class="label" x="574" y="508" style="font-size:12px">그 밖의 경로</text>

  <!-- S3 사진·모델 -->
  <rect x="1040" y="452" width="310" height="132" rx="16" class="card"/>
  <g transform="translate(1058 470)">
    <path d="M2 4h26l-3 24H5z" fill="#FDF0E6" stroke="#C7531F" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="15" cy="4" rx="13" ry="3.5" fill="#FDF0E6" stroke="#C7531F" stroke-width="2"/>
  </g>
  <text class="name" x="1098" y="488" style="font-size:15px">S3 여행기 사진 · 모델</text>
  <text class="meta" x="1098" y="507">비공개 버킷</text>
  <text class="item" x="1058" y="536">· 사진은 서버를 거쳐 저장 (EXIF 제거)</text>
  <text class="item" x="1058" y="557">· 앱은 5분 서명 URL로 바로 받음</text>
  <text class="item" x="1058" y="578">· 취향 순위 모델 파일</text>
  <path class="line" d="M1050 416V450" marker-end="url(#a)"/>

  <!-- 백엔드 → 외부 서비스 -->
  <path class="line" d="M1000 416V676" marker-end="url(#a)"/>
  <text class="label" x="1012" y="640">외부 API</text>
  <text class="path" x="1012" y="658">서버에서 호출</text>

  <!-- ───────── 외부 서비스 ───────── -->
  <rect x="680" y="680" width="690" height="200" rx="22" fill="#FAFBFA" stroke="#B9C2BD" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="700" y="664" width="92" height="30" rx="15" fill="#5F6663"/>
  <text class="pill" x="716" y="684">외부 서비스</text>

  <rect x="700" y="710" width="250" height="150" rx="16" fill="#FFFBE0" stroke="#E5C800" stroke-width="1.8"/>
  <g transform="translate(718 726)">
    <path d="M15 2C7.3 2 1 7 1 13.2c0 4 2.6 7.5 6.6 9.5L6 29l6.6-4.3c.8.1 1.6.2 2.4.2 7.7 0 14-5 14-11.2S22.7 2 15 2z" fill="#FEE500" stroke="#3C1E1E" stroke-width="1.6"/>
  </g>
  <text class="name" x="758" y="744" style="font-size:15px">카카오</text>
  <text class="meta" x="758" y="763">kauth · kapi · dapi · 모빌리티</text>
  <text class="item" x="718" y="792">· 로그인 (앱 웹뷰 → 서버가 확인)</text>
  <text class="item" x="718" y="813">· 지도 JS SDK (앱 웹뷰가 직접)</text>
  <text class="item" x="718" y="834">· 식당 검색 (로컬)</text>
  <text class="item" x="718" y="855">· 길찾기 (자동차·도보·대중교통)</text>

  <rect x="966" y="710" width="200" height="150" rx="16" class="card"/>
  <g transform="translate(984 726)">
    <path d="M3 4h10l6 3 8-3v22l-8 3-6-3H3z" fill="#E7F8EF" stroke="#0B6C40" stroke-width="2" stroke-linejoin="round"/>
    <path d="M13 4v22M19 7v22" stroke="#0B6C40" stroke-width="1.6"/>
  </g>
  <text class="name" x="1022" y="744" style="font-size:14px">한국관광공사</text>
  <text class="meta" x="1022" y="763">TourAPI</text>
  <text class="item" x="984" y="792">· 관광지·음식점 정보</text>
  <text class="item" x="984" y="813">  (DB에 미리 적재)</text>
  <text class="item" x="984" y="834">· 관광지 사진</text>
  <text class="item" x="984" y="855">  (앱이 직접 표시)</text>

  <rect x="1182" y="710" width="168" height="150" rx="16" class="card"/>
  <g transform="translate(1200 726)">
    <path d="M14 0c1.2 7.5 6.5 12.8 14 14-7.5 1.2-12.8 6.5-14 14C12.8 20.5 7.5 15.2 0 14 7.5 12.8 12.8 7.5 14 0z" fill="#EEF3FF" stroke="#3B6FD4" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text class="name" x="1236" y="744" style="font-size:14px">Google</text>
  <text class="meta" x="1236" y="763">Gemini</text>
  <text class="item" x="1200" y="792">· 코스 소개 문장</text>
  <text class="item" x="1200" y="813">· 지역 맞춤 문장</text>
  <text class="item" x="1200" y="834">· 한 줄 소개 초안</text>
  <text class="meta" x="1200" y="855">(AI 서버가 호출)</text>

  <!-- 앱 → 외부 (직접) -->
  <path class="line green dash" d="M310 420H334V780H698" marker-end="url(#ag)"/>
  <text class="label" x="346" y="452">앱이 직접</text>
  <text class="path" x="346" y="470">카카오 지도·로그인</text>
  <text class="path" x="346" y="488">관광지 사진 · 서명 URL 사진</text>

  <!-- ───────── GitHub Actions ───────── -->
  <rect x="40" y="560" width="270" height="170" rx="18" class="card"/>
  <g transform="translate(58 578)">
    <circle cx="15" cy="15" r="14" fill="#F4F6F5" stroke="#202520" stroke-width="2"/>
    <path d="M11 9l10 6-10 6z" fill="#202520"/>
  </g>
  <text class="name" x="98" y="596">GitHub Actions</text>
  <text class="meta" x="98" y="615">frontend main 푸시</text>
  <text class="item" x="58" y="646">1. 테스트 → 릴리스 APK 빌드</text>
  <text class="item" x="58" y="668">2. versionCode = 1000 + 빌드 번호</text>
  <text class="item" x="58" y="690">3. OIDC 역할로 S3 업로드</text>
  <text class="item" x="58" y="712">4. CloudFront 캐시 비우기</text>
  <!-- 점선과 만나는 곳을 다리처럼 끊어 보이게 흰 밑줄을 먼저 깝니다 -->
  <path d="M312 610H660V560H700" fill="none" stroke="#ffffff" stroke-width="9"/>
  <path class="line orange" d="M310 610H660V560H708" marker-end="url(#ao)"/>
  <text class="label" x="420" y="600" style="font-size:12px">APK 올리기 (OIDC)</text>
  <text class="path" x="420" y="628">카카오 키는 SSM에서</text>

  <!-- 범례 -->
  <g transform="translate(40 840)">
    <path class="line" d="M0 0H38" marker-end="url(#a)"/>
    <text class="meta" x="48" y="5">서버를 거치는 요청</text>
    <path class="line green dash" d="M190 0H228" marker-end="url(#ag)"/>
    <text class="meta" x="238" y="5">앱이 직접 부르는 곳</text>
    <text class="meta" x="0" y="34">개발 중에는 목업 서버(앱 안)나 로컬 백엔드로 바꿔 붙일 수 있습니다.</text>
  </g>
</svg>
